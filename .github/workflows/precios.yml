name: Actualizar precios

on:
  schedule:
    - cron: '0 11 * * *' # 5:00 a. m. en Guatemala
  workflow_dispatch:

permissions:
  contents: write

jobs:
  walmart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run precios:walmart
      - name: Guardar precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/precios-extraidos.json
          git diff --cached --quiet || git commit -m "Actualizar precios de Walmart"
          git push
