name: Buscar fotos

on:
  push:
    branches: [main]
    paths: [scraper/fotos-busquedas.ts, scraper/fotos.ts]
  workflow_dispatch:
    inputs:
      todas:
        description: Volver a buscar todas las fotos
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  commons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fotos -- ${{ inputs.todas && '--todas' || '' }}
      - name: Guardar fotos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fotos scraper/fotos-elegidas.json src/data/fotos.ts
          git diff --cached --quiet || git commit -m "Actualizar fotos de recetas"
          git pull --rebase origin main
          git push
